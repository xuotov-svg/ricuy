<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=yes">
  <title>Рисовалка</title>
  <link rel="icon" type="image/jpeg" href="https://github.com/xuotov-svg/ricuy/blob/main/ZelrnCYKsVet_ylfxqQOl2CKB1zgSsItID6ynW5pNu6Ikz8KkA2JeUMLT0fIn-gbTsGbaZ2TLk2A0pKuk2af9Rtt.jpg?raw=true">
  <link rel="apple-touch-icon" href="https://github.com/xuotov-svg/ricuy/blob/main/Ml_rC_6HYns77eqtuciPw79_J74AA2EfyzzASr1qchM3N42DcV1eKhAlSgKz2kno7sAD6TTxRDDJM0ANsDJnNijj.jpg?raw=true">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    :root {
      --bg: #1a0520;
      --surface: rgba(22, 8, 33, 0.9);
      --surface2: rgba(38, 16, 52, 0.95);
      --text: #f5e9ff;
      --text2: #d0bdf4;
      --accent: #ff3388;
      --accent2: #ff8030;
      --accent3: #20c0ff;
      --accent4: #c840e9;
      --border: rgba(255, 255, 255, 0.2);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
      --radius: 22px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0d0015;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      font-family: var(--font);
      overflow: hidden;
      touch-action: manipulation;
      position: fixed;
      width: 100%;
      color: var(--text);
      transition: background 0.5s;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(200, 30, 100, 0.3) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(30, 140, 255, 0.3) 0%, transparent 50%),
        radial-gradient(ellipse at 40% 80%, rgba(255, 140, 0, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 60% 20%, rgba(180, 0, 255, 0.3) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
      animation: bgShift 12s ease-in-out infinite alternate;
    }
    @keyframes bgShift {
      0% { opacity: 0.8; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    /* floating paint splatters */
    .paint-splatter {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(40px);
      animation: floatSplatter 18s ease-in-out infinite;
      opacity: 0.5;
    }
    .splatter1 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #ff3388 0%, transparent 70%);
      top: 10%; left: 5%;
      animation-delay: 0s;
    }
    .splatter2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #8030ff 0%, transparent 70%);
      bottom: 5%; right: 5%;
      animation-delay: -6s;
      animation-duration: 22s;
    }
    .splatter3 {
      width: 250px; height: 250px;
      background: radial-gradient(circle, #ff8030 0%, transparent 70%);
      top: 40%; left: 60%;
      animation-delay: -12s;
      animation-duration: 20s;
    }
    .splatter4 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, #20c0ff 0%, transparent 70%);
      top: 60%; left: 10%;
      animation-delay: -3s;
      animation-duration: 25s;
    }
    @keyframes floatSplatter {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(60px, -50px) scale(1.2); }
      50% { transform: translate(-30px, 40px) scale(0.9); }
      75% { transform: translate(-50px, -30px) scale(1.1); }
    }

    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* LAUNCHER */
    .launcher {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      background: rgba(15, 3, 24, 0.92);
      backdrop-filter: blur(18px);
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .launcher.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .launcher h1 {
      font-size: clamp(3.8rem, 14vw, 8rem);
      font-weight: 900;
      background: linear-gradient(135deg, #ff3388, #ff8030, #c840e9, #20c0ff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 60px rgba(255, 51, 136, 0.9));
      letter-spacing: 8px;
      text-align: center;
      animation: titlePulse 3s ease-in-out infinite alternate, gradientShift 4s ease infinite;
      position: relative;
    }
    .launcher h1::after {
      content: "";
      position: absolute;
      inset: -20px;
      background: radial-gradient(circle, rgba(255,51,136,0.4) 0%, transparent 70%);
      border-radius: 50%;
      z-index: -1;
      filter: blur(30px);
      animation: glowPulse 2s ease-in-out infinite alternate;
    }
    @keyframes titlePulse {
      0% { filter: drop-shadow(0 0 40px rgba(255,51,136,0.7)); }
      100% { filter: drop-shadow(0 0 90px rgba(200,64,233,1)); }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes glowPulse {
      0% { opacity: 0.6; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }
    .launcher-buttons {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .launcher button {
      background: linear-gradient(135deg, rgba(255,51,136,0.9), rgba(200,64,233,0.9));
      backdrop-filter: blur(30px);
      border: 2px solid rgba(255,255,255,0.3);
      color: white;
      font-size: 1.25rem;
      font-weight: 800;
      padding: 1.1rem 3.2rem;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255,51,136,0.5), 0 0 50px rgba(200,64,233,0.5);
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.5, 1);
      letter-spacing: 1.5px;
      min-height: 62px;
      position: relative;
      overflow: hidden;
      animation: btnFloat 4s ease-in-out infinite;
    }
    .launcher button:nth-child(2) {
      background: linear-gradient(135deg, rgba(32,192,255,0.9), rgba(128,48,255,0.9));
      animation-delay: -2s;
    }
    @keyframes btnFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .launcher button::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 64px;
      background: linear-gradient(135deg, #ff3388, #c840e9, #20c0ff, #ff8030);
      background-size: 300% 300%;
      z-index: -1;
      animation: borderGlow 3s linear infinite;
      opacity: 0.7;
      filter: blur(8px);
    }
    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }
    .launcher button:hover {
      transform: translateY(-6px) scale(1.04);
      box-shadow: 0 18px 40px rgba(255,128,48,0.8), 0 0 70px rgba(200,64,233,0.9);
    }
    .launcher button:active {
      transform: scale(0.93);
      background: linear-gradient(135deg, #ff3388, #20c0ff);
      transition: 0.1s;
    }

    /* APP */
    .app {
      display: none;
      flex: 1;
      flex-direction: column;
      background: transparent;
      position: relative;
    }
    .app.active {
      display: flex;
    }

    /* TOOLBAR */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(14, 5, 22, 0.85);
      backdrop-filter: blur(45px);
      border-bottom: 2px solid rgba(255, 180, 220, 0.3);
      align-items: center;
      z-index: 50;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
      position: relative;
    }
    .toolbar::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #ff3388, #c840e9, #20c0ff, #ff8030, #ff3388);
      background-size: 200% 100%;
      animation: rainbowBar 4s linear infinite;
    }
    @keyframes rainbowBar {
      0% { background-position: 0% 0%; }
      100% { background-position: 200% 0%; }
    }
    .tool-group {
      display: flex;
      gap: 6px;
      align-items: center;
      background: rgba(28, 14, 40, 0.7);
      backdrop-filter: blur(16px);
      padding: 6px 12px;
      border-radius: 40px;
      flex-wrap: wrap;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s;
    }
    .tool-group:hover {
      border-color: rgba(255, 128, 48, 0.6);
      box-shadow: 0 0 20px rgba(255,128,48,0.3);
    }

    button,
    select {
      background: rgba(40, 22, 58, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text2);
      font-size: 0.75rem;
      padding: 8px 14px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.25s ease;
      font-weight: 600;
      white-space: nowrap;
      min-height: 38px;
      -webkit-appearance: none;
      font-family: var(--font);
      letter-spacing: 0.5px;
      backdrop-filter: blur(8px);
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }
    button:hover,
    select:hover {
      background: rgba(255, 51, 136, 0.3);
      color: #fff;
      box-shadow: 0 0 22px rgba(255, 51, 136, 0.6);
      border-color: rgba(255,255,255,0.5);
      transform: translateY(-2px);
    }
    button:active {
      background: var(--accent);
      color: white;
      box-shadow: 0 0 30px var(--accent);
      transform: scale(0.92);
      transition: 0.1s;
    }
    .active-tool {
      background: linear-gradient(135deg, var(--accent), #b44dff) !important;
      box-shadow: 0 0 30px var(--accent), 0 0 20px #b44dff !important;
      color: #fff !important;
      font-weight: 800;
      border-color: rgba(255,255,255,0.6) !important;
      animation: toolGlow 1.5s ease-in-out infinite alternate;
    }
    @keyframes toolGlow {
      0% { box-shadow: 0 0 25px var(--accent), 0 0 15px #b44dff; }
      100% { box-shadow: 0 0 45px #ff8030, 0 0 30px #c840e9; }
    }

    input[type="color"] {
      width: 38px;
      height: 38px;
      padding: 3px;
      border-radius: 50%;
      background: #2a1a3a;
      border: 2px solid rgba(255, 255, 255, 0.4);
      min-height: auto;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
    }
    input[type="color"]:hover {
      box-shadow: 0 0 28px rgba(255, 180, 80, 0.9);
      transform: scale(1.1);
    }
    input[type="range"] {
      width: 65px;
      accent-color: var(--accent2);
      padding: 0;
      min-height: auto;
      cursor: pointer;
    }
    .zoom-info,
    .size-value {
      color: var(--text2);
      font-size: 0.7rem;
      min-width: 42px;
      text-align: center;
      font-weight: 600;
      background: rgba(0,0,0,0.3);
      padding: 4px 8px;
      border-radius: 20px;
    }

    /* CANVAS */
    .canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #0a0312;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(160, 60, 200, 0.2), transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(255, 120, 40, 0.2), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(20, 160, 255, 0.15), transparent 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    canvas {
      position: absolute;
      cursor: crosshair;
      image-rendering: auto;
      touch-action: none;
      filter: drop-shadow(0 0 14px rgba(0,0,0,0.7));
      border-radius: 4px;
      transition: filter 0.3s;
    }

    /* text input overlay */
    .text-input-overlay {
      position: absolute;
      z-index: 60;
      display: none;
      background: rgba(20, 8, 35, 0.95);
      border: 2px solid var(--accent);
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 0 35px rgba(255,51,136,0.7);
      backdrop-filter: blur(20px);
    }
    .text-input-overlay input {
      background: rgba(30,15,40,0.9);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 1rem;
      outline: none;
      min-width: 180px;
      font-family: var(--font);
    }
    .text-input-overlay .text-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    /* selection marquee */
    .selection-marquee {
      position: absolute;
      border: 2px dashed #fff;
      pointer-events: none;
      z-index: 55;
      display: none;
      mix-blend-mode: difference;
      animation: dashAnim 1s linear infinite;
    }
    @keyframes dashAnim {
      0% { border-color: #fff; }
      50% { border-color: #ff3388; }
      100% { border-color: #fff; }
    }

    /* MODALS */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(22px);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: rgba(20, 10, 35, 0.96);
      border: 1px solid rgba(255, 180, 220, 0.4);
      border-radius: 30px;
      padding: 26px;
      width: 92vw;
      max-width: 460px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 35px 60px rgba(0,0,0,0.9), 0 0 55px rgba(255,51,136,0.6);
      overflow: hidden;
      animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes modalPop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 {
      font-size: 1.7rem;
      background: linear-gradient(135deg, #ff3388, #20c0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
    }
    .layer-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .layer-actions button {
      flex: 1;
      font-size: 0.7rem;
      padding: 8px 8px;
      background: rgba(50, 30, 70, 0.8);
      border-radius: 24px;
      text-align: center;
      font-weight: 600;
    }
    .layers-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: 45vh;
      padding-right: 6px;
    }
    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(35, 20, 52, 0.9);
      border-radius: 24px;
      color: var(--text);
      font-size: 0.8rem;
      cursor: pointer;
      border: 2px solid transparent;
      gap: 8px;
      transition: 0.2s;
      font-weight: 500;
      flex-wrap: wrap;
    }
    .layer-item.active {
      border-color: #ff3388;
      box-shadow: 0 0 22px rgba(255, 51, 136, 0.7);
      background: rgba(55, 30, 75, 0.95);
    }
    .layer-item button {
      padding: 5px 10px;
      font-size: 0.65rem;
      background: rgba(120, 80, 180, 0.7);
      min-height: auto;
      border-radius: 18px;
      font-weight: 600;
    }
    .layer-opacity {
      width: 70px;
      accent-color: var(--accent2);
    }
    .layer-filters {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 4px;
      width: 100%;
    }
    .layer-filters label {
      font-size: 0.6rem;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .layer-filters input {
      width: 50px;
      accent-color: var(--accent3);
    }

    /* GALLERY */
    .gallery-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s, visibility 0.35s;
    }
    .gallery-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .gallery-modal {
      background: rgba(20, 10, 35, 0.96);
      border: 1px solid rgba(255, 180, 220, 0.35);
      border-radius: 30px;
      padding: 26px;
      width: 94vw;
      max-width: 880px;
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 35px 65px rgba(0,0,0,0.9), 0 0 50px rgba(255,128,48,0.5);
      overflow: hidden;
      animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .gallery-header h2 {
      font-size: 2rem;
      background: linear-gradient(135deg, #ff8030, #c840e9, #20c0ff);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
      animation: gradientShift 3s ease infinite;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 18px;
      overflow-y: auto;
      padding: 8px;
      flex: 1;
    }
    .gallery-item {
      background: rgba(35, 20, 52, 0.85);
      border-radius: 22px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.12);
      transition: 0.3s ease;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    .gallery-item:hover {
      border-color: var(--accent2);
      box-shadow: 0 0 30px rgba(255,128,48,0.7);
      transform: translateY(-5px);
      background: rgba(50, 28, 70, 0.9);
    }
    .gallery-item img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
    }
    .gallery-item .info {
      font-size: 0.7rem;
      color: var(--text2);
      text-align: center;
    }
    .gallery-item .actions {
      display: flex;
      gap: 8px;
    }
    .gallery-item .actions button {
      font-size: 0.65rem;
      padding: 5px 10px;
      min-height: auto;
      font-weight: 700;
    }

    .gallery-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.12);
      text-transform: uppercase;
      background: linear-gradient(135deg, rgba(255,51,136,0.2), rgba(32,192,255,0.2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: emptyPulse 3s ease-in-out infinite;
    }
    @keyframes emptyPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #ff3388, #c840e9);
      border-radius: 10px;
    }

    @media (max-width: 700px) {
      button, select, input {
        font-size: 0.65rem;
        padding: 6px 10px;
        min-height: 34px;
      }
      .toolbar {
        padding: 6px 8px;
        gap: 5px;
      }
      .tool-group {
        padding: 4px 8px;
        gap: 2px;
      }
      .modal-content {
        width: 95vw;
        padding: 18px;
      }
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      }
      .launcher h1 {
        font-size: 3rem;
      }
      .gallery-empty {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="paint-splatter splatter1"></div>
  <div class="paint-splatter splatter2"></div>
  <div class="paint-splatter splatter3"></div>
  <div class="paint-splatter splatter4"></div>

  <div class="launcher" id="launcher">
    <h1>РИСОВАЛКА</h1>
    <div class="launcher-buttons">
      <button id="startBtn">НАЧАТЬ РИСОВАТЬ</button>
      <button id="galleryLauncherBtn">ГАЛЕРЕЯ</button>
    </div>
  </div>

  <div class="app-container">

  <input type="file" id="imageLoader" accept="image/*" style="display:none;">

  <script>
    (function() {
      const launcher = document.getElementById('launcher');
      const app = document.getElementById('app');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const container = document.getElementById('canvasContainer');

      const layersModalOverlay = document.getElementById('layersModalOverlay');
      const layersListContainer = document.getElementById('layersListContainer');
      const closeLayersModalBtn = document.getElementById('closeLayersModalBtn');
      const galleryOverlay = document.getElementById('galleryOverlay');
      const galleryGrid = document.getElementById('galleryGrid');
      const closeGalleryBtn = document.getElementById('closeGalleryBtn');
      const textInputOverlay = document.getElementById('textInputOverlay');
      const textInputField = document.getElementById('textInputField');
      const selectionMarquee = document.getElementById('selectionMarquee');

      let drawing = false;
      let currentTool = 'brush';
      let currentColor = '#ff3388';
      let secondaryColor = '#8030ff';
      let lineWidth = 14;
      let globalCompositeOp = 'normal';
      let points = [];
      let shapeStart = null;
      let symmetryEnabled = false;
      let symmetryAxis = 'x';
      let gradientBrush = false;
      let selecting = false;
      let selection = null;
      let selectionData = null;
      let selectionMoving = false;
      let selectionMoveStart = null;
      let selectionOffset = {x:0,y:0};

      let layers = [];
      let activeLayerIndex = 0;
      let zoom = 1;
      let panX = 0, panY = 0;
      const canvasDrawWidth = 800;
      const canvasDrawHeight = 600;

      let undoStack = [];
      let redoStack = [];
      const MAX_UNDO = 70;

      const toolButtons = {
        brush: document.getElementById('brushBtn'),
        neon: document.getElementById('neonBrushBtn'),
        pencil: document.getElementById('pencilBtn'),
        spray: document.getElementById('sprayBtn'),
        splatter: document.getElementById('splatterBtn'),
        eraser: document.getElementById('eraserBtn'),
        fill: document.getElementById('fillBtn'),
        eyedropper: document.getElementById('eyedropperBtn'),
        blur: document.getElementById('blurBtn'),
        text: document.getElementById('textBtn'),
        shapeRect: document.getElementById('shapeRectBtn'),
        shapeOval: document.getElementById('shapeOvalBtn'),
        shapeLine: document.getElementById('shapeLineBtn'),
        shapeTriangle: document.getElementById('shapeTriangleBtn'),
        shapeStar: document.getElementById('shapeStarBtn'),
        shapeHeart: document.getElementById('shapeHeartBtn'),
        select: document.getElementById('selectBtn'),
      };

      const colorPicker = document.getElementById('colorPicker');
      const colorPicker2 = document.getElementById('colorPicker2');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');
      const blendSelect = document.getElementById('blendMode');
      const layersToggleBtn = document.getElementById('layersToggleBtn');
      const symmetryBtn = document.getElementById('symmetryBtn');
      const gradientToggleBtn = document.getElementById('gradientToggleBtn');
      const zoomInBtn = document.getElementById('zoomInBtn');
      const zoomOutBtn = document.getElementById('zoomOutBtn');
      const zoomResetBtn = document.getElementById('zoomResetBtn');
      const zoomLevelSpan = document.getElementById('zoomLevel');
      const downloadBtn = document.getElementById('downloadBtn');
      const saveToGalleryBtn = document.getElementById('saveToGalleryBtn');
      const loadImageBtn = document.getElementById('loadImageBtn');
      const imageLoader = document.getElementById('imageLoader');
      const newCanvasBtn = document.getElementById('newCanvasBtn');
      const undoBtn = document.getElementById('undoBtn');
      const redoBtn = document.getElementById('redoBtn');
      const homeBtn = document.getElementById('homeBtn');

      function initLayers() {
        const baseCanvas = document.createElement('canvas');
        baseCanvas.width = canvasDrawWidth;
        baseCanvas.height = canvasDrawHeight;
        baseCanvas.getContext('2d').fillStyle = '#ffffff';
        baseCanvas.getContext('2d').fillRect(0, 0, canvasDrawWidth, canvasDrawHeight);
        layers = [{ canvas: baseCanvas, visible: true, opacity: 1, brightness: 100, contrast: 100, saturation: 100, blur: 0 }];
        activeLayerIndex = 0;
        undoStack = [];
        redoStack = [];
        saveUndoState();
        renderLayersList();
      }

      function saveUndoState() {
        const activeCanvas = layers[activeLayerIndex]?.canvas;
        if (!activeCanvas) return;
        const snapshot = document.createElement('canvas');
        snapshot.width = activeCanvas.width;
        snapshot.height = activeCanvas.height;
        snapshot.getContext('2d').drawImage(activeCanvas, 0, 0);
        undoStack.push({ canvas: snapshot, layerIndex: activeLayerIndex });
        if (undoStack.length > MAX_UNDO) undoStack.shift();
        redoStack = [];
      }

      function undo() {
        if (undoStack.length === 0) return;
        const activeCanvas = layers[activeLayerIndex]?.canvas;
        if (!activeCanvas) return;
        const currentSnap = document.createElement('canvas');
        currentSnap.width = activeCanvas.width;
        currentSnap.height = activeCanvas.height;
        currentSnap.getContext('2d').drawImage(activeCanvas, 0, 0);
        redoStack.push({ canvas: currentSnap, layerIndex: activeLayerIndex });
        const last = undoStack.pop();
        if (last && layers[last.layerIndex]) {
          const lc = layers[last.layerIndex].canvas;
          lc.getContext('2d').clearRect(0, 0, lc.width, lc.height);
          lc.getContext('2d').drawImage(last.canvas, 0, 0);
          composeAndRender();
        }
      }

      function redo() {
        if (redoStack.length === 0) return;
        const activeCanvas = layers[activeLayerIndex]?.canvas;
        if (!activeCanvas) return;
        const currentSnap = document.createElement('canvas');
        currentSnap.width = activeCanvas.width;
        currentSnap.height = activeCanvas.height;
        currentSnap.getContext('2d').drawImage(activeCanvas, 0, 0);
        undoStack.push({ canvas: currentSnap, layerIndex: activeLayerIndex });
        const next = redoStack.pop();
        if (next && layers[next.layerIndex]) {
          const lc = layers[next.layerIndex].canvas;
          lc.getContext('2d').clearRect(0, 0, lc.width, lc.height);
          lc.getContext('2d').drawImage(next.canvas, 0, 0);
          composeAndRender();
        }
      }

      function getCompositeImage() {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvasDrawWidth;
        tempCanvas.height = canvasDrawHeight;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.fillStyle = '#ffffff';
        tempCtx.fillRect(0, 0, canvasDrawWidth, canvasDrawHeight);
        layers.forEach(layer => {
          if (layer.visible) {
            tempCtx.save();
            tempCtx.globalAlpha = layer.opacity || 1;
            const f = layer;
            let filterStr = '';
            if (f.brightness !== 100) filterStr += `brightness(${f.brightness}%) `;
            if (f.contrast !== 100) filterStr += `contrast(${f.contrast}%) `;
            if (f.saturation !== 100) filterStr += `saturate(${f.saturation}%) `;
            if (f.blur > 0) filterStr += `blur(${f.blur}px) `;
            if (filterStr) tempCtx.filter = filterStr.trim();
            tempCtx.drawImage(layer.canvas, 0, 0);
            tempCtx.filter = 'none';
            tempCtx.restore();
          }
        });
        return tempCanvas;
      }

      function composeAndRender() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        const composite = getCompositeImage();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(panX, panY);
        ctx.scale(zoom, zoom);
        ctx.drawImage(composite, 0, 0);
        if (selection) {
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2 / zoom;
          ctx.setLineDash([8 / zoom, 4 / zoom]);
          ctx.strokeRect(selection.x, selection.y, selection.w, selection.h);
          ctx.setLineDash([]);
        }
        ctx.restore();
      }

      function openLayersModal() { renderLayersList(); layersModalOverlay.classList.add('show'); }
      function closeLayersModal() { layersModalOverlay.classList.remove('show'); }

      function renderLayersList() {
        layersListContainer.innerHTML = '';
        layers.forEach((layer, idx) => {
          const div = document.createElement('div');
          div.className = 'layer-item' + (idx === activeLayerIndex ? ' active' : '');
          div.innerHTML = `<span style="flex:1;">Слой ${idx+1}</span>`;

          const opacityInput = document.createElement('input');
          opacityInput.type = 'range';
          opacityInput.className = 'layer-opacity';
          opacityInput.min = '0'; opacityInput.max = '1'; opacityInput.step = '0.05';
          opacityInput.value = layer.opacity || 1;
          opacityInput.addEventListener('input', (e) => {
            e.stopPropagation();
            layer.opacity = parseFloat(e.target.value);
            composeAndRender();
          });
          div.appendChild(opacityInput);

          const delBtn = document.createElement('button');
          delBtn.textContent = 'X';
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (layers.length <= 1) return;
            layers.splice(idx, 1);
            if (activeLayerIndex >= layers.length) activeLayerIndex = layers.length - 1;
            renderLayersList();
            composeAndRender();
          });
          div.appendChild(delBtn);

          const filtersDiv = document.createElement('div');
          filtersDiv.className = 'layer-filters';
          const props = ['brightness','contrast','saturation'];
          props.forEach(prop => {
            const label = document.createElement('label');
            label.textContent = prop.slice(0,3);
            const inp = document.createElement('input');
            inp.type = 'range';
            inp.min = prop==='saturation'?0:20;
            inp.max = prop==='saturation'?300:200;
            inp.value = layer[prop] || 100;
            inp.addEventListener('input', (ev) => {
              ev.stopPropagation();
              layer[prop] = parseInt(inp.value);
              composeAndRender();
            });
            label.appendChild(inp);
            filtersDiv.appendChild(label);
          });
          const blurLabel = document.createElement('label');
          blurLabel.textContent = 'blur';
          const blurInp = document.createElement('input');
          blurInp.type = 'range'; blurInp.min = 0; blurInp.max = 20; blurInp.value = layer.blur || 0;
          blurInp.addEventListener('input', (ev) => {
            ev.stopPropagation();
            layer.blur = parseInt(blurInp.value);
            composeAndRender();
          });
          blurLabel.appendChild(blurInp);
          filtersDiv.appendChild(blurLabel);
          div.appendChild(filtersDiv);

          div.addEventListener('click', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'LABEL') return;
            activeLayerIndex = idx;
            renderLayersList();
          });
          layersListContainer.appendChild(div);
        });
      }

      document.getElementById('addLayerModalBtn').addEventListener('click', () => { addLayer(); renderLayersList(); });
      document.getElementById('duplicateLayerModalBtn').addEventListener('click', () => { duplicateLayer(); renderLayersList(); });
      document.getElementById('mergeDownModalBtn').addEventListener('click', () => { mergeDown(); renderLayersList(); });
      document.getElementById('flipHorizBtn').addEventListener('click', () => { flipLayer('h'); });
      document.getElementById('flipVertBtn').addEventListener('click', () => { flipLayer('v'); });

      function addLayer() {
        const nc = document.createElement('canvas');
        nc.width = canvasDrawWidth; nc.height = canvasDrawHeight;
        nc.getContext('2d').clearRect(0, 0, nc.width, nc.height);
        layers.push({ canvas: nc, visible: true, opacity: 1, brightness:100, contrast:100, saturation:100, blur:0 });
        activeLayerIndex = layers.length - 1;
        saveUndoState(); composeAndRender();
      }
      function duplicateLayer() {
        const src = layers[activeLayerIndex].canvas;
        const nc = document.createElement('canvas');
        nc.width = canvasDrawWidth; nc.height = canvasDrawHeight;
        nc.getContext('2d').drawImage(src, 0, 0);
        const srcLayer = layers[activeLayerIndex];
        layers.push({ canvas: nc, visible: true, opacity: srcLayer.opacity||1, brightness:srcLayer.brightness||100, contrast:srcLayer.contrast||100, saturation:srcLayer.saturation||100, blur:srcLayer.blur||0 });
        activeLayerIndex = layers.length - 1;
        saveUndoState(); composeAndRender();
      }
      function mergeDown() {
        if (activeLayerIndex <= 0) return;
        const upper = layers[activeLayerIndex].canvas;
        const lower = layers[activeLayerIndex - 1].canvas;
        const lowerCtx = lower.getContext('2d');
        lowerCtx.globalAlpha = layers[activeLayerIndex].opacity || 1;
        lowerCtx.drawImage(upper, 0, 0);
        lowerCtx.globalAlpha = 1;
        layers.splice(activeLayerIndex, 1);
        activeLayerIndex--;
        saveUndoState(); composeAndRender();
      }
      function flipLayer(dir) {
        const lc = layers[activeLayerIndex].canvas;
        const ctx2 = lc.getContext('2d');
        const imgData = ctx2.getImageData(0,0,lc.width,lc.height);
        const flipped = document.createElement('canvas');
        flipped.width = lc.width; flipped.height = lc.height;
        const fctx = flipped.getContext('2d');
        fctx.putImageData(imgData,0,0);
        ctx2.clearRect(0,0,lc.width,lc.height);
        ctx2.save();
        if (dir==='h') { ctx2.translate(lc.width,0); ctx2.scale(-1,1); }
        else { ctx2.translate(0,lc.height); ctx2.scale(1,-1); }
        ctx2.drawImage(flipped,0,0);
        ctx2.restore();
        saveUndoState(); composeAndRender();
      }

      function newCanvas() {
        if (confirm('Создать новый холст? Несохранённые данные будут потеряны.')) {
          initLayers(); composeAndRender(); closeLayersModal();
        }
      }

      // Gallery
      function getGallery() {
        try { return JSON.parse(localStorage.getItem('drawingGallery')) || []; }
        catch { return []; }
      }
      function saveGallery(gallery) {
        localStorage.setItem('drawingGallery', JSON.stringify(gallery));
      }
      function addToGallery() {
        const composite = getCompositeImage();
        const dataUrl = composite.toDataURL('image/jpeg', 0.75);
        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.width = 200; thumbCanvas.height = 150;
        thumbCanvas.getContext('2d').drawImage(composite, 0, 0, 200, 150);
        const thumbDataUrl = thumbCanvas.toDataURL('image/jpeg', 0.7);
        const gallery = getGallery();
        if (gallery.length >= 30) { alert('Галерея заполнена (макс. 30). Удалите старые рисунки.'); return; }
        const item = {
          id: Date.now(),
          name: 'Рисунок ' + new Date().toLocaleString(),
          dataUrl: dataUrl,
          thumbnail: thumbDataUrl,
          date: new Date().toISOString()
        };
        gallery.unshift(item);
        saveGallery(gallery);
        alert('Сохранено в галерею!');
      }
      function renderGallery() {
        galleryGrid.innerHTML = '';
        const gallery = getGallery();
        if (gallery.length === 0) {
          galleryGrid.innerHTML = '<div class="gallery-empty">ГАЛЕРЕЯ ПУСТА</div>';
          return;
        }
        gallery.forEach(item => {
          const div = document.createElement('div');
          div.className = 'gallery-item';
          const img = document.createElement('img');
          img.src = item.thumbnail;
          img.style.width = '100%'; img.style.borderRadius = '10px'; img.style.background = '#fff';
          div.appendChild(img);
          const info = document.createElement('div'); info.className = 'info';
          info.textContent = new Date(item.date).toLocaleDateString();
          div.appendChild(info);
          const actions = document.createElement('div'); actions.className = 'actions';
          const editBtn = document.createElement('button'); editBtn.textContent = 'Ред.';
          editBtn.addEventListener('click', (e) => { e.stopPropagation(); loadFromGallery(item); });
          const delBtn = document.createElement('button'); delBtn.textContent = 'Удалить';
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (confirm('Удалить рисунок из галереи?')) {
              const g = getGallery().filter(i => i.id !== item.id);
              saveGallery(g); renderGallery();
            }
          });
          actions.appendChild(editBtn); actions.appendChild(delBtn);
          div.appendChild(actions);
          div.addEventListener('click', () => loadFromGallery(item));
          galleryGrid.appendChild(div);
        });
      }
      function loadFromGallery(item) {
        if (confirm('Открыть рисунок из галереи? Текущий холст будет заменён.')) {
          const img = new Image();
          img.onload = () => {
            initLayers();
            const lc = layers[0].canvas;
            lc.getContext('2d').clearRect(0, 0, lc.width, lc.height);
            lc.getContext('2d').drawImage(img, 0, 0, canvasDrawWidth, canvasDrawHeight);
            saveUndoState(); composeAndRender(); closeGallery();
          };
          img.src = item.dataUrl;
        }
      }
      function openGallery() { galleryOverlay.classList.add('show'); renderGallery(); }
      function closeGallery() { galleryOverlay.classList.remove('show'); }

      function loadImageToLayer(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const nc = document.createElement('canvas');
            nc.width = canvasDrawWidth; nc.height = canvasDrawHeight;
            nc.getContext('2d').drawImage(img, 0, 0, canvasDrawWidth, canvasDrawHeight);
            layers.push({ canvas: nc, visible: true, opacity: 1, brightness:100, contrast:100, saturation:100, blur:0 });
            activeLayerIndex = layers.length - 1;
            saveUndoState(); renderLayersList(); composeAndRender();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        let cx, cy;
        if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
        else if (e.changedTouches && e.changedTouches.length > 0) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
        else { cx = e.clientX; cy = e.clientY; }
        return {
          x: (cx - rect.left - panX) / zoom,
          y: (cy - rect.top - panY) / zoom
        };
      }

      function getColorAtPixel(x, y) {
        const composite = getCompositeImage();
        const compCtx = composite.getContext('2d');
        const px = Math.round(x), py = Math.round(y);
        if (px < 0 || px >= canvasDrawWidth || py < 0 || py >= canvasDrawHeight) return null;
        const p = compCtx.getImageData(px, py, 1, 1).data;
        return `#${p[0].toString(16).padStart(2,'0')}${p[1].toString(16).padStart(2,'0')}${p[2].toString(16).padStart(2,'0')}`;
      }

      function floodFill(sx, sy, fillColor) {
        const lc = layers[activeLayerIndex].canvas;
        const lctx = lc.getContext('2d');
        const imageData = lctx.getImageData(0, 0, lc.width, lc.height);
        const data = imageData.data;
        const w = lc.width, h = lc.height;
        const ix = Math.round(sx), iy = Math.round(sy);
        if (ix < 0 || ix >= w || iy < 0 || iy >= h) return;
        const idx = (iy * w + ix) * 4;
        const tr = data[idx], tg = data[idx+1], tb = data[idx+2], ta = data[idx+3];
        const tmp = document.createElement('canvas'); tmp.width = 1; tmp.height = 1;
        const tctx = tmp.getContext('2d'); tctx.fillStyle = fillColor; tctx.fillRect(0,0,1,1);
        const fd = tctx.getImageData(0,0,1,1).data;
        const fr=fd[0], fg=fd[1], fb=fd[2], fa=fd[3];
        if (tr===fr && tg===fg && tb===fb && ta===fa) return;
        const stack = [[ix, iy]];
        const visited = new Uint8Array(w * h);
        while (stack.length) {
          const [cx, cy] = stack.pop();
          if (cx<0||cx>=w||cy<0||cy>=h) continue;
          const cid = (cy*w+cx)*4;
          if (visited[cy*w+cx]) continue;
          if (data[cid]!==tr || data[cid+1]!==tg || data[cid+2]!==tb || data[cid+3]!==ta) continue;
          visited[cy*w+cx]=1;
          data[cid]=fr; data[cid+1]=fg; data[cid+2]=fb; data[cid+3]=fa;
          stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
        }
        lctx.putImageData(imageData, 0, 0);
      }

      function blurAt(x, y, radius) {
        const lc = layers[activeLayerIndex].canvas;
        const lctx = lc.getContext('2d');
        const r = Math.max(2, Math.floor(radius));
        const sx = Math.round(x - r), sy = Math.round(y - r);
        const sw = r*2, sh = r*2;
        if (sx<0||sy<0||sx+sw>lc.width||sy+sh>lc.height) return;
        const imageData = lctx.getImageData(sx, sy, sw, sh);
        const d = imageData.data;
        const tmp = new Uint8ClampedArray(d);
        for (let py=1; py<sh-1; py++) {
          for (let px=1; px<sw-1; px++) {
            let sr=0,sg=0,sb=0,sa=0;
            for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++) {
              const idx = ((py+dy)*sw+(px+dx))*4;
              sr+=tmp[idx]; sg+=tmp[idx+1]; sb+=tmp[idx+2]; sa+=tmp[idx+3];
            }
            const idx = (py*sw+px)*4;
            d[idx]=sr/9; d[idx+1]=sg/9; d[idx+2]=sb/9; d[idx+3]=sa/9;
          }
        }
        lctx.putImageData(imageData, sx, sy);
      }

      function applySymmetry(px, py, callback) {
        const w = canvasDrawWidth, h = canvasDrawHeight;
        callback(px, py);
        if (symmetryEnabled) {
          if (symmetryAxis.includes('x')) callback(w - px, py);
          if (symmetryAxis.includes('y')) callback(px, h - py);
          if (symmetryAxis === 'xy') callback(w - px, h - py);
        }
      }

      function drawDot(pos, colorOverride = null) {
        const lc = layers[activeLayerIndex].canvas;
        const lctx = lc.getContext('2d');
        const col = colorOverride || ((currentTool==='eraser')?'#ffffff':currentColor);
        lctx.beginPath();
        lctx.arc(pos.x, pos.y, lineWidth/2, 0, Math.PI*2);
        lctx.fillStyle = col;
        lctx.fill();
      }

      function smoothLine(p1, p2) {
        const lc = layers[activeLayerIndex].canvas;
        const lctx = lc.getContext('2d');
        const steps = Math.max(2, Math.floor(Math.hypot(p2.x-p1.x, p2.y-p1.y) / 3));
        for (let i=0; i<steps; i++) {
          const t = i / steps;
          const x = p1.x + (p2.x-p1.x) * t;
          const y = p1.y + (p2.y-p1.y) * t;
          const col = gradientBrush ? interpolateColor(currentColor, secondaryColor, t) : (currentTool==='eraser'?'#ffffff':currentColor);
          lctx.beginPath();
          lctx.arc(x, y, (currentTool==='pencil'?Math.max(1, lineWidth*0.4):lineWidth)/2, 0, Math.PI*2);
          lctx.fillStyle = col;
          lctx.globalCompositeOperation = (currentTool==='eraser')?'destination-out':globalCompositeOp;
          lctx.fill();
          if (currentTool==='neon') {
            lctx.save();
            lctx.globalCompositeOperation='lighter';
            lctx.shadowColor=col;
            lctx.shadowBlur=18;
            lctx.fill();
            lctx.restore();
          }
        }
      }

      function interpolateColor(c1, c2, t) {
        const r1=parseInt(c1.slice(1,3),16), g1=parseInt(c1.slice(3,5),16), b1=parseInt(c1.slice(5,7),16);
        const r2=parseInt(c2.slice(1,3),16), g2=parseInt(c2.slice(3,5),16), b2=parseInt(c2.slice(5,7),16);
        const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
        return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
      }

      function splatterAt(pos) {
        const lc = layers[activeLayerIndex].canvas;
        const lctx = lc.getContext('2d');
        lctx.save();
        lctx.globalCompositeOperation = (currentTool==='eraser')?'destination-out':globalCompositeOp;
        const blobCount = Math.floor(lineWidth * 1.2);
        for (let i=0; i<blobCount; i++) {
          const angle = Math.random()*Math.PI*2;
          const dist = Math.random()*lineWidth*1.4;
          const rx = pos.x + Math.cos(angle)*dist;
          const ry = pos.y + Math.sin(angle)*dist;
          const rad = Math.random()*lineWidth*0.8 + 2;
          lctx.beginPath();
          lctx.ellipse(rx, ry, rad, rad*0.6, Math.random()*Math.PI, 0, Math.PI*2);
          lctx.fillStyle = gradientBrush ? interpolateColor(currentColor, secondaryColor, Math.random()) : currentColor;
          lctx.fill();
        }
        lctx.restore();
      }

      function startDraw(e) {
        e.preventDefault();
        if (currentTool === 'select') {
          if (selection && !selectionMoving) {
            const pos = getPos(e);
            if (pos.x >= selection.x && pos.x <= selection.x+selection.w && pos.y >= selection.y && pos.y <= selection.y+selection.h) {
              selectionMoving = true;
              selectionMoveStart = pos;
              selectionData = document.createElement('canvas');
              selectionData.width = selection.w; selectionData.height = selection.h;
              const lc = layers[activeLayerIndex].canvas;
              selectionData.getContext('2d').drawImage(lc, selection.x, selection.y, selection.w, selection.h, 0, 0, selection.w, selection.h);
              const lctx = lc.getContext('2d');
              lctx.fillStyle = '#ffffff';
              lctx.fillRect(selection.x, selection.y, selection.w, selection.h);
              composeAndRender();
              return;
            } else {
              selection = null; selectionMoving = false; selectionData = null;
              composeAndRender();
            }
          }
          drawing = true;
          shapeStart = getPos(e);
          return;
        }
        if (currentTool === 'fill') {
          const pos = getPos(e);
          saveUndoState();
          floodFill(pos.x, pos.y, currentColor);
          composeAndRender();
          return;
        }
        if (currentTool === 'eyedropper') {
          const pos = getPos(e);
          const col = getColorAtPixel(pos.x, pos.y);
          if (col) { currentColor = col; colorPicker.value = col; }
          return;
        }
        if (currentTool === 'splatter') {
          saveUndoState();
          const pos = getPos(e);
          applySymmetry(pos.x, pos.y, (x,y) => splatterAt({x,y}));
          composeAndRender();
          drawing = false;
          return;
        }
        if (currentTool === 'text') {
          const pos = getPos(e);
          textInputOverlay.style.display = 'block';
          textInputOverlay.style.left = (pos.x * zoom + panX) + 'px';
          textInputOverlay.style.top = (pos.y * zoom + panY - 40) + 'px';
          textInputField.focus();
          textInputField._pos = pos;
          return;
        }
        drawing = true;
        saveUndoState();
        const pos = getPos(e);
        points = [pos];
        if (['shapeRect','shapeOval','shapeLine','shapeTriangle','shapeStar','shapeHeart'].includes(currentTool)) {
          shapeStart = pos;
        } else if (currentTool === 'spray') {
          applySymmetry(pos.x, pos.y, (x,y) => sprayAtPos({x,y}));
        } else if (currentTool === 'blur') {
          applySymmetry(pos.x, pos.y, (x,y) => blurAt(x, y, lineWidth));
          composeAndRender();
        } else {
          applySymmetry(pos.x, pos.y, (x,y) => drawDot({x,y}));
          composeAndRender();
        }
      }

      function draw(e) {
        if (!drawing && !(currentTool==='select' && selectionMoving)) return;
        e.preventDefault();
        const pos = getPos(e);

        if (currentTool === 'select') {
          if (selectionMoving && selectionData && selectionMoveStart) {
            const dx = pos.x - selectionMoveStart.x;
            const dy = pos.y - selectionMoveStart.y;
            selection.x += dx; selection.y += dy;
            selectionMoveStart = pos;
            composeAndRender();
            return;
          }
          if (!drawing) return;
          composeAndRender();
          selection = null;
          if (shapeStart) {
            const x = Math.min(shapeStart.x, pos.x);
            const y = Math.min(shapeStart.y, pos.y);
            const w = Math.abs(pos.x - shapeStart.x);
            const h = Math.abs(pos.y - shapeStart.y);
            if (w > 5 && h > 5) selection = {x,y,w,h};
            composeAndRender();
          }
          return;
        }

        if (['shapeRect','shapeOval','shapeLine','shapeTriangle','shapeStar','shapeHeart'].includes(currentTool)) {
          if (!shapeStart) return;
          composeAndRender();
          const lc = layers[activeLayerIndex].canvas;
          const lctx = lc.getContext('2d');
          lctx.save();
          lctx.globalCompositeOperation = (currentTool==='eraser')?'destination-out':globalCompositeOp;
          lctx.strokeStyle = currentColor;
          lctx.fillStyle = secondaryColor;
          lctx.lineWidth = lineWidth;
          lctx.lineCap = 'round';
          lctx.beginPath();
          if (currentTool === 'shapeRect') {
            lctx.rect(shapeStart.x, shapeStart.y, pos.x-shapeStart.x, pos.y-shapeStart.y);
            lctx.fill(); lctx.stroke();
          } else if (currentTool === 'shapeOval') {
            const rx = Math.abs(pos.x-shapeStart.x)/2, ry = Math.abs(pos.y-shapeStart.y)/2;
            const cx = (shapeStart.x+pos.x)/2, cy = (shapeStart.y+pos.y)/2;
            lctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
            lctx.fill(); lctx.stroke();
          } else if (currentTool === 'shapeLine') {
            lctx.moveTo(shapeStart.x, shapeStart.y);
            lctx.lineTo(pos.x, pos.y);
            lctx.stroke();
          } else if (currentTool === 'shapeTriangle') {
            const cx = (shapeStart.x+pos.x)/2;
            lctx.moveTo(cx, shapeStart.y);
            lctx.lineTo(pos.x, pos.y);
            lctx.lineTo(shapeStart.x, pos.y);
            lctx.closePath();
            lctx.fill(); lctx.stroke();
          } else if (currentTool === 'shapeStar') {
            const cx = (shapeStart.x+pos.x)/2, cy = (shapeStart.y+pos.y)/2;
            const outerR = Math.min(Math.abs(pos.x-shapeStart.x), Math.abs(pos.y-shapeStart.y))/2;
            const innerR = outerR*0.4;
            const spikes = 5;
            for (let i=0; i<spikes*2; i++) {
              const angle = (i*Math.PI/spikes) - Math.PI/2;
              const r = i%2===0 ? outerR : innerR;
              const sx = cx + Math.cos(angle)*r;
              const sy = cy + Math.sin(angle)*r;
              if (i===0) lctx.moveTo(sx,sy);
              else lctx.lineTo(sx,sy);
            }
            lctx.closePath();
            lctx.fill(); lctx.stroke();
          } else if (currentTool === 'shapeHeart') {
            const w = pos.x - shapeStart.x, h = pos.y - shapeStart.y;
            const cx = shapeStart.x + w/2, cy = shapeStart.y + h/2;
            const s = Math.min(Math.abs(w), Math.abs(h)) * 0.4;
            lctx.moveTo(cx, cy + s*1.2);
            lctx.bezierCurveTo(cx - s, cy - s*0.2, cx - s*0.5, cy - s*0.9, cx, cy - s*0.4);
            lctx.bezierCurveTo(cx + s*0.5, cy - s*0.9, cx + s, cy - s*0.2, cx, cy + s*1.2);
            lctx.fill(); lctx.stroke();
          }
          lctx.restore();
          return;
        }
        if (currentTool === 'spray') {
          applySymmetry(pos.x, pos.y, (x,y) => sprayAtPos({x,y}));
          return;
        }
        if (currentTool === 'blur') {
          applySymmetry(pos.x, pos.y, (x,y) => blurAt(x, y, lineWidth));
          composeAndRender();
          return;
        }
        points.push(pos);
        if (points.length > 3) points.shift();
        if (points.length >= 2) {
          const p1 = points[points.length-2], p2 = points[points.length-1];
          applySymmetry(p1.x, p1.y, (x1,y1) => {
            applySymmetry(p2.x, p2.y, (x2,y2) => smoothLine({x:x1,y:y1}, {x:x2,y:y2}));
          });
          composeAndRender();
        }
      }

      function endDraw(e) {
        if (currentTool === 'select') {
          if (selectionMoving) {
            selectionMoving = false;
            if (selection && selectionData) {
              const lc = layers[activeLayerIndex].canvas;
              const lctx = lc.getContext('2d');
              lctx.drawImage(selectionData, selection.x, selection.y);
              selection = null; selectionData = null; selectionMoveStart = null;
              saveUndoState(); composeAndRender();
            }
            return;
          }
          drawing = false;
          shapeStart = null;
          return;
        }
        if (drawing) {
          if (['shapeRect','shapeOval','shapeLine','shapeTriangle','shapeStar','shapeHeart'].includes(currentTool) && shapeStart) {
            const pos = getPos(e);
            const lc = layers[activeLayerIndex].canvas;
            const lctx = lc.getContext('2d');
            lctx.save();
            lctx.globalCompositeOperation = (currentTool==='eraser')?'destination-out':globalCompositeOp;
            lctx.strokeStyle = currentColor;
            lctx.fillStyle = secondaryColor;
            lctx.lineWidth = lineWidth;
            lctx.lineCap = 'round';
            lctx.beginPath();
            if (currentTool === 'shapeRect') {
              lctx.rect(shapeStart.x, shapeStart.y, pos.x-shapeStart.x, pos.y-shapeStart.y);
              lctx.fill(); lctx.stroke();
            } else if (currentTool === 'shapeOval') {
              const rx = Math.abs(pos.x-shapeStart.x)/2, ry = Math.abs(pos.y-shapeStart.y)/2;
              const cx = (shapeStart.x+pos.x)/2, cy = (shapeStart.y+pos.y)/2;
              lctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
              lctx.fill(); lctx.stroke();
            } else if (currentTool === 'shapeLine') {
              lctx.moveTo(shapeStart.x, shapeStart.y);
              lctx.lineTo(pos.x, pos.y);
              lctx.stroke();
            } else if (currentTool === 'shapeTriangle') {
              const cx = (shapeStart.x+pos.x)/2;
              lctx.moveTo(cx, shapeStart.y);
              lctx.lineTo(pos.x, pos.y);
              lctx.lineTo(shapeStart.x, pos.y);
              lctx.closePath();
              lctx.fill(); lctx.stroke();
            } else if (currentTool === 'shapeStar') {
              const cx = (shapeStart.x+pos.x)/2, cy = (shapeStart.y+pos.y)/2;
              const outerR = Math.min(Math.abs(pos.x-shapeStart.x), Math.abs(pos.y-shapeStart.y))/2;
              const innerR = outerR*0.4;
              const spikes = 5;
              for (let i=0; i<spikes*2; i++) {
                const angle = (i*Math.PI/spikes) - Math.PI/2;
                const r = i%2===0 ? outerR : innerR;
                const sx = cx + Math.cos(angle)*r;
                const sy = cy + Math.sin(angle)*r;
                if (i===0) lctx.moveTo(sx,sy);
                else lctx.lineTo(sx,sy);
              }
              lctx.closePath();
              lctx.fill(); lctx.stroke();
            } else if (currentTool === 'shapeHeart') {
              const w = pos.x - shapeStart.x, h = pos.y - shapeStart.y;
              const cx = shapeStart.x + w/2, cy = shapeStart.y + h/2;
              const s = Math.min(Math.abs(w), Math.abs(h)) * 0.4;
              lctx.moveTo(cx, cy + s*1.2);
              lctx.bezierCurveTo(cx - s, cy - s*0.2, cx - s*0.5, cy - s*0.9, cx, cy - s*0.4);
              lctx.bezierCurveTo(cx + s*0.5, cy - s*0.9, cx + s, cy - s*0.2, cx, cy + s*1.2);
              lctx.fill(); lctx.stroke();
            }
            lctx.restore();
            composeAndRender();
          }
          drawing = false;
          points = [];
          shapeStart = null;
        }
      }

      function sprayAtPos(pos) {
        const lc = layers[activeLayerIndex].canvas;
        const lctx = lc.getContext('2d');
        const density = Math.floor(lineWidth * 2.5);
        lctx.fillStyle = currentColor;
        for (let i=0; i<density; i++) {
          const angle = Math.random()*Math.PI*2;
          const dist = Math.random()*lineWidth;
          lctx.fillRect(pos.x+Math.cos(angle)*dist, pos.y+Math.sin(angle)*dist, 2, 2);
        }
        composeAndRender();
      }

      function setActiveTool(tool) {
        currentTool = tool;
        Object.values(toolButtons).forEach(b => b.classList.remove('active-tool'));
        if (toolButtons[tool]) toolButtons[tool].classList.add('active-tool');
        canvas.style.cursor = (tool==='eraser')?'cell':(tool==='select')?'move':'crosshair';
        shapeStart = null;
        selection = null; selectionMoving = false; selectionData = null;
        textInputOverlay.style.display = 'none';
        composeAndRender();
      }

      function toggleSymmetry() {
        if (!symmetryEnabled) { symmetryEnabled = true; symmetryAxis = 'x'; symmetryBtn.textContent = 'Симм. X'; symmetryBtn.classList.add('active-tool'); }
        else if (symmetryAxis === 'x') { symmetryAxis = 'y'; symmetryBtn.textContent = 'Симм. Y'; }
        else if (symmetryAxis === 'y') { symmetryAxis = 'xy'; symmetryBtn.textContent = 'Симм. XY'; }
        else { symmetryEnabled = false; symmetryBtn.textContent = 'Симметрия'; symmetryBtn.classList.remove('active-tool'); }
      }

      function updateZoom() {
        zoomLevelSpan.textContent = Math.round(zoom*100)+'%';
        composeAndRender();
      }

      function goHome() {
        if (confirm('Выйти в главное меню? Несохранённые изменения будут потеряны.')) {
          app.classList.remove('active');
          launcher.classList.remove('hidden');
        }
      }

      // Text tool
      document.getElementById('applyTextBtn').addEventListener('click', () => {
        const txt = textInputField.value.trim();
        if (txt && textInputField._pos) {
          saveUndoState();
          const lc = layers[activeLayerIndex].canvas;
          const lctx = lc.getContext('2d');
          lctx.font = `${lineWidth*2}px "${getComputedStyle(document.body).fontFamily.split(',')[0].replace(/['"]/g,'')}", sans-serif`;
          lctx.fillStyle = currentColor;
          lctx.fillText(txt, textInputField._pos.x, textInputField._pos.y);
          composeAndRender();
        }
        textInputOverlay.style.display = 'none';
        textInputField.value = '';
      });
      document.getElementById('cancelTextBtn').addEventListener('click', () => {
        textInputOverlay.style.display = 'none';
        textInputField.value = '';
      });

      // Event listeners
      document.getElementById('startBtn').addEventListener('click', ()=>{
        launcher.classList.add('hidden');
        app.classList.add('active');
        if (layers.length === 0) initLayers();
        composeAndRender();
      });
      document.getElementById('galleryLauncherBtn').addEventListener('click', openGallery);
      closeGalleryBtn.addEventListener('click', closeGallery);
      galleryOverlay.addEventListener('click', (e)=>{ if(e.target===galleryOverlay) closeGallery(); });

      Object.entries(toolButtons).forEach(([tool, btn]) => {
        btn.addEventListener('click', (e) => { e.preventDefault(); setActiveTool(tool); });
      });

      gradientToggleBtn.addEventListener('click', (e) => {
        e.preventDefault();
        gradientBrush = !gradientBrush;
        gradientToggleBtn.classList.toggle('active-tool', gradientBrush);
      });

      symmetryBtn.addEventListener('click', (e) => { e.preventDefault(); toggleSymmetry(); });
      undoBtn.addEventListener('click', (e)=>{ e.preventDefault(); undo(); });
      redoBtn.addEventListener('click', (e)=>{ e.preventDefault(); redo(); });
      colorPicker.addEventListener('input', e => currentColor = e.target.value);
      colorPicker2.addEventListener('input', e => secondaryColor = e.target.value);
      sizeSlider.addEventListener('input', e => { lineWidth = parseInt(e.target.value); sizeValue.textContent = lineWidth+'px'; });
      blendSelect.addEventListener('change', e => globalCompositeOp = e.target.value);
      downloadBtn.addEventListener('click', (e)=>{
        e.preventDefault();
        const comp = getCompositeImage();
        const a = document.createElement('a');
        a.download = 'рисунок_'+Date.now()+'.png';
        a.href = comp.toDataURL('image/png');
        a.click();
      });
      saveToGalleryBtn.addEventListener('click', (e)=>{ e.preventDefault(); addToGallery(); });
      newCanvasBtn.addEventListener('click', (e)=>{ e.preventDefault(); newCanvas(); });
      loadImageBtn.addEventListener('click', (e)=>{ e.preventDefault(); imageLoader.click(); });
      imageLoader.addEventListener('change', e => { if(e.target.files[0]){ loadImageToLayer(e.target.files[0]); imageLoader.value=''; } });
      zoomInBtn.addEventListener('click', e=>{ e.preventDefault(); zoom=Math.min(zoom*1.25,5); updateZoom(); });
      zoomOutBtn.addEventListener('click', e=>{ e.preventDefault(); zoom=Math.max(zoom/1.25,0.15); updateZoom(); });
      zoomResetBtn.addEventListener('click', e=>{ e.preventDefault(); zoom=1; panX=0; panY=0; updateZoom(); });
      homeBtn.addEventListener('click', e => { e.preventDefault(); goHome(); });

      layersToggleBtn.addEventListener('click', (e) => { e.preventDefault(); openLayersModal(); });
      closeLayersModalBtn.addEventListener('click', closeLayersModal);
      layersModalOverlay.addEventListener('click', (e) => { if (e.target === layersModalOverlay) closeLayersModal(); });

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', endDraw);
      canvas.addEventListener('mouseleave', endDraw);
      canvas.addEventListener('touchstart', startDraw, {passive: false});
      canvas.addEventListener('touchmove', draw, {passive: false});
      canvas.addEventListener('touchend', endDraw);
      canvas.addEventListener('touchcancel', endDraw);

      window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key==='z') { e.preventDefault(); undo(); }
        if (e.ctrlKey && e.key==='y') { e.preventDefault(); redo(); }
        if (e.ctrlKey && e.key==='s') { e.preventDefault(); downloadBtn.click(); }
        if (e.key === 'Escape') { selection = null; selectionMoving = false; selectionData = null; composeAndRender(); textInputOverlay.style.display = 'none'; }
      });

      window.addEventListener('resize', composeAndRender);
      initLayers();
      composeAndRender();
    })();
  </script>
</body>
</html>
