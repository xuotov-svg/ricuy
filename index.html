<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=yes">
  <title>Рисовалка</title>
  <link rel="icon" type="image/jpeg" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    :root {
      --bg: #1a0a2e;
      --surface: rgba(20, 12, 40, 0.85);
      --surface2: rgba(30, 18, 50, 0.9);
      --text: #f0e6ff;
      --text2: #c9b8ff;
      --accent: #ff4da6;
      --accent2: #ff9d3c;
      --accent3: #4dc9f6;
      --border: rgba(255, 255, 255, 0.2);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
      --glow-accent: 0 0 25px rgba(255, 77, 166, 0.7);
      --glow-pink: 0 0 25px rgba(255, 157, 60, 0.7);
      --radius: 20px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(ellipse at 30% 40%, #3a1040, #0d0018);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      font-family: var(--font);
      overflow: hidden;
      touch-action: manipulation;
      position: fixed;
      width: 100%;
      color: var(--text);
      transition: background 0.4s;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 70% 20%, rgba(255,180,80,0.15), transparent 55%),
                  radial-gradient(circle at 20% 80%, rgba(180,100,255,0.15), transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* LAUNCHER */
    .launcher {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.8rem;
      background: radial-gradient(ellipse at 40% 35%, #4c1d5a, #140625);
      transition: opacity 0.5s, visibility 0.5s;
      backdrop-filter: blur(6px);
    }
    .launcher.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .launcher h1 {
      font-size: clamp(4rem, 14vw, 7.5rem);
      font-weight: 900;
      background: linear-gradient(135deg, #ff7eb3, #ff4da6, #8b5cf6, #4dc9f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 50px rgba(255, 77, 166, 0.8));
      letter-spacing: 5px;
      text-align: center;
      animation: titlePulse 2.8s infinite alternate;
    }
    @keyframes titlePulse {
      0% { filter: drop-shadow(0 0 40px rgba(255,77,166,0.7)); }
      100% { filter: drop-shadow(0 0 70px rgba(138,92,246,1)); }
    }
    .launcher-buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .launcher button {
      background: linear-gradient(135deg, rgba(255,77,166,0.9), rgba(138,92,246,0.9));
      backdrop-filter: blur(20px);
      border: none;
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 1rem 3rem;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255,77,166,0.5), 0 0 30px rgba(138,92,246,0.5);
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.5, 1);
      letter-spacing: 1px;
      min-height: 58px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.3);
    }
    .launcher button:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 15px 35px rgba(255,157,60,0.8), 0 0 45px rgba(138,92,246,0.9);
    }
    .launcher button:active {
      transform: scale(0.94);
      background: linear-gradient(135deg, #ff7eb3, #4dc9f6);
    }

    /* APP */
    .app {
      display: none;
      flex: 1;
      flex-direction: column;
      background: transparent;
      position: relative;
    }
    .app.active {
      display: flex;
    }

    /* TOOLBAR */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(18, 10, 32, 0.8);
      backdrop-filter: blur(35px);
      border-bottom: 1px solid rgba(255, 220, 240, 0.25);
      align-items: center;
      z-index: 50;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    .tool-group {
      display: flex;
      gap: 6px;
      align-items: center;
      background: rgba(25, 16, 44, 0.65);
      backdrop-filter: blur(12px);
      padding: 6px 12px;
      border-radius: 40px;
      flex-wrap: wrap;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    button,
    select {
      background: rgba(30, 20, 52, 0.7);
      border: none;
      color: var(--text2);
      font-size: 0.75rem;
      padding: 8px 14px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.25s;
      font-weight: 600;
      white-space: nowrap;
      min-height: 38px;
      -webkit-appearance: none;
      font-family: var(--font);
      letter-spacing: 0.4px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    button:hover,
    select:hover {
      background: rgba(255, 77, 166, 0.3);
      color: #fff;
      box-shadow: 0 0 18px rgba(255, 77, 166, 0.6);
      border-color: rgba(255,255,255,0.4);
    }
    button:active {
      background: var(--accent);
      color: white;
      box-shadow: 0 0 25px var(--accent);
      transform: scale(0.92);
    }
    .active-tool {
      background: linear-gradient(135deg, var(--accent), #b44dff) !important;
      box-shadow: 0 0 28px var(--accent), 0 0 15px #b44dff !important;
      color: #fff !important;
      font-weight: 700;
      border-color: rgba(255,255,255,0.6);
    }

    input[type="color"] {
      width: 36px;
      height: 36px;
      padding: 3px;
      border-radius: 50%;
      background: #2a1a3a;
      border: 2px solid rgba(255, 255, 255, 0.4);
      min-height: auto;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 0 12px rgba(0,0,0,0.3);
    }
    input[type="color"]:hover {
      box-shadow: 0 0 22px rgba(255, 180, 80, 0.8);
      transform: scale(1.08);
    }
    input[type="range"] {
      width: 60px;
      accent-color: var(--accent2);
      padding: 0;
      min-height: auto;
      cursor: pointer;
    }
    .zoom-info,
    .size-value {
      color: var(--text2);
      font-size: 0.7rem;
      min-width: 40px;
      text-align: center;
      font-weight: 600;
    }

    /* CANVAS */
    .canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #0c061a;
      background-image: radial-gradient(circle at 20% 30%, rgba(120,50,180,0.2), transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(255,140,50,0.2), transparent 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    canvas {
      position: absolute;
      cursor: crosshair;
      image-rendering: auto;
      touch-action: none;
      filter: drop-shadow(0 0 10px rgba(0,0,0,0.6));
      border-radius: 4px;
    }

    /* LAYERS MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(18px);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }
    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: rgba(22, 14, 38, 0.96);
      border: 1px solid rgba(255, 200, 240, 0.35);
      border-radius: 28px;
      padding: 24px;
      width: 90vw;
      max-width: 420px;
      max-height: 75vh;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.9), 0 0 45px rgba(255,77,166,0.5);
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 {
      font-size: 1.6rem;
      background: linear-gradient(135deg, #ff7eb3, #4dc9f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
    }
    .layer-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .layer-actions button {
      flex: 1;
      font-size: 0.7rem;
      padding: 8px 8px;
      background: rgba(45, 30, 70, 0.8);
      border-radius: 24px;
      text-align: center;
      font-weight: 600;
    }
    .layers-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: 45vh;
      padding-right: 4px;
    }
    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(32, 22, 50, 0.9);
      border-radius: 24px;
      color: var(--text);
      font-size: 0.8rem;
      cursor: pointer;
      border: 2px solid transparent;
      gap: 8px;
      transition: 0.2s;
      font-weight: 500;
    }
    .layer-item.active {
      border-color: #ff4da6;
      box-shadow: 0 0 18px rgba(255, 77, 166, 0.7);
      background: rgba(50, 30, 70, 0.95);
    }
    .layer-item button {
      padding: 5px 10px;
      font-size: 0.65rem;
      background: rgba(120, 80, 180, 0.7);
      min-height: auto;
      border-radius: 18px;
      font-weight: 600;
    }
    .layer-opacity {
      width: 70px;
      accent-color: var(--accent2);
    }

    /* GALLERY MODAL */
    .gallery-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }
    .gallery-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .gallery-modal {
      background: rgba(22, 14, 38, 0.96);
      border: 1px solid rgba(255, 200, 240, 0.3);
      border-radius: 28px;
      padding: 24px;
      width: 92vw;
      max-width: 850px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 45px rgba(255,157,60,0.4);
      overflow: hidden;
    }
    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .gallery-header h2 {
      font-size: 1.9rem;
      background: linear-gradient(135deg, #ff9d3c, #4dc9f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      overflow-y: auto;
      padding: 6px;
      flex: 1;
    }
    .gallery-item {
      background: rgba(32, 20, 52, 0.8);
      border-radius: 20px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.1);
      transition: 0.25s;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .gallery-item:hover {
      border-color: var(--accent2);
      box-shadow: 0 0 24px rgba(255,157,60,0.6);
      transform: translateY(-4px);
      background: rgba(45,28,65,0.9);
    }
    .gallery-item img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
    }
    .gallery-item .info {
      font-size: 0.7rem;
      color: var(--text2);
      text-align: center;
    }
    .gallery-item .actions {
      display: flex;
      gap: 8px;
    }
    .gallery-item .actions button {
      font-size: 0.65rem;
      padding: 5px 10px;
      min-height: auto;
      font-weight: 600;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #ff4da6;
      border-radius: 10px;
    }

    @media (max-width: 700px) {
      button, select, input {
        font-size: 0.65rem;
        padding: 6px 10px;
        min-height: 36px;
      }
      .toolbar {
        padding: 6px 10px;
        gap: 6px;
      }
      .tool-group {
        padding: 4px 8px;
        gap: 3px;
      }
      .modal-content {
        width: 94vw;
        padding: 18px;
      }
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      }
      .launcher h1 {
        font-size: 3.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="launcher" id="launcher">
    <h1>РИСОВАЛКА</h1>
    <div class="launcher-buttons">
      <button id="startBtn">НАЧАТЬ РИСОВАТЬ</button>
      <button id="galleryLauncherBtn">ГАЛЕРЕЯ</button>
    </div>
  </div>

  <div class="app-container">
    <div class="app" id="app">
      <div class="toolbar" id="toolbar">
        <div class="tool-group">
          <button id="brushBtn" class="active-tool">Кисть</button>
          <button id="neonBrushBtn">Неон</button>
          <button id="pencilBtn">Карандаш</button>
          <button id="sprayBtn">Распылитель</button>
          <button id="eraserBtn">Ластик</button>
          <button id="fillBtn">Заливка</button>
          <button id="eyedropperBtn">Пипетка</button>
          <button id="blurBtn">Размытие</button>
        </div>
        <div class="tool-group">
          <button id="shapeRectBtn">Прямоуг.</button>
          <button id="shapeOvalBtn">Овал</button>
          <button id="shapeLineBtn">Линия</button>
          <button id="symmetryBtn" title="Вкл/выкл симметрию">Симметрия</button>
        </div>
        <div class="tool-group">
          <input type="color" id="colorPicker" value="#ff4da6">
          <input type="color" id="colorPicker2" value="#8b5cf6" title="Второй цвет">
          <input type="range" id="sizeSlider" min="1" max="70" value="14">
          <span class="size-value" id="sizeValue">14px</span>
        </div>
        <div class="tool-group">
          <select id="blendMode">
            <option value="normal">Обычный</option>
            <option value="multiply">Умножение</option>
            <option value="screen">Осветление</option>
            <option value="overlay">Перекрытие</option>
            <option value="soft-light">Мягкий свет</option>
            <option value="color-burn">Затемнение</option>
            <option value="color-dodge">Осветл. основы</option>
          </select>
          <button id="undoBtn">Отменить</button>
          <button id="redoBtn">Повторить</button>
          <button id="layersToggleBtn">Слои</button>
        </div>
        <div class="tool-group">
          <button id="zoomInBtn">+</button>
          <span class="zoom-info" id="zoomLevel">100%</span>
          <button id="zoomOutBtn">-</button>
          <button id="zoomResetBtn">Сброс</button>
          <button id="downloadBtn">Экспорт</button>
          <button id="saveToGalleryBtn">В галерею</button>
          <button id="loadImageBtn">Открыть</button>
          <button id="newCanvasBtn">Новый</button>
          <button id="homeBtn" style="background: rgba(255,157,60,0.2);">В меню</button>
        </div>
      </div>
      <div class="canvas-container" id="canvasContainer">
        <canvas id="canvas"></canvas>
      </div>
    </div>
  </div>

  <!-- Модальное окно слоёв -->
  <div class="modal-overlay" id="layersModalOverlay">
    <div class="modal-content" id="layersModalContent">
      <div class="modal-header">
        <h3>Слои</h3>
        <button id="closeLayersModalBtn" style="font-size:1.3rem; padding:6px 14px; background:rgba(255,255,255,0.1); border-radius:20px;">Закрыть</button>
      </div>
      <div class="layer-actions" id="layerActionsPanel">
        <button id="addLayerModalBtn">+ Слой</button>
        <button id="duplicateLayerModalBtn">Копия</button>
        <button id="mergeDownModalBtn">Слить вниз</button>
      </div>
      <div class="layers-list" id="layersListContainer"></div>
    </div>
  </div>

  <!-- Галерея -->
  <div class="gallery-overlay" id="galleryOverlay">
    <div class="gallery-modal">
      <div class="gallery-header">
        <h2>Галерея</h2>
        <button id="closeGalleryBtn" style="font-size:1.3rem; padding:6px 18px; background:rgba(255,255,255,0.1); border-radius:20px;">Закрыть</button>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </div>

  <input type="file" id="imageLoader" accept="image/*" style="display:none;">

  <script>
    (function() {
      const launcher = document.getElementById('launcher');
      const app = document.getElementById('app');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const container = document.getElementById('canvasContainer');

      // Modals
      const layersModalOverlay = document.getElementById('layersModalOverlay');
      const layersListContainer = document.getElementById('layersListContainer');
      const closeLayersModalBtn = document.getElementById('closeLayersModalBtn');
      const galleryOverlay = document.getElementById('galleryOverlay');
      const galleryGrid = document.getElementById('galleryGrid');
      const closeGalleryBtn = document.getElementById('closeGalleryBtn');

      let drawing = false;
      let currentTool = 'brush';
      let currentColor = '#ff4da6';
      let secondaryColor = '#8b5cf6';
      let lineWidth = 14;
      let globalCompositeOp = 'normal';
      let points = [];
      let shapeStart = null;
      let symmetryEnabled = false;
      let symmetryAxis = 'x';

      let layers = [];
      let activeLayerIndex = 0;
      let zoom = 1;
      let panX = 0, panY = 0;
      const canvasDrawWidth = 800;
      const canvasDrawHeight = 600;

      let undoStack = [];
      let redoStack = [];
      const MAX_UNDO = 60;

      const toolButtons = {
        brush: document.getElementById('brushBtn'),
        neon: document.getElementById('neonBrushBtn'),
        pencil: document.getElementById('pencilBtn'),
        spray: document.getElementById('sprayBtn'),
        eraser: document.getElementById('eraserBtn'),
        fill: document.getElementById('fillBtn'),
        eyedropper: document.getElementById('eyedropperBtn'),
        blur: document.getElementById('blurBtn'),
        shapeRect: document.getElementById('shapeRectBtn'),
        shapeOval: document.getElementById('shapeOvalBtn'),
        shapeLine: document.getElementById('shapeLineBtn'),
      };

      const colorPicker = document.getElementById('colorPicker');
      const colorPicker2 = document.getElementById('colorPicker2');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');
      const blendSelect = document.getElementById('blendMode');
      const layersToggleBtn = document.getElementById('layersToggleBtn');
      const symmetryBtn = document.getElementById('symmetryBtn');
      const zoomInBtn = document.getElementById('zoomInBtn');
      const zoomOutBtn = document.getElementById('zoomOutBtn');
      const zoomResetBtn = document.getElementById('zoomResetBtn');
      const zoomLevelSpan = document.getElementById('zoomLevel');
      const downloadBtn = document.getElementById('downloadBtn');
      const saveToGalleryBtn = document.getElementById('saveToGalleryBtn');
      const loadImageBtn = document.getElementById('loadImageBtn');
      const imageLoader = document.getElementById('imageLoader');
      const newCanvasBtn = document.getElementById('newCanvasBtn');
      const undoBtn = document.getElementById('undoBtn');
      const redoBtn = document.getElementById('redoBtn');
      const homeBtn = document.getElementById('homeBtn');

      // Инициализация слоёв
      function initLayers() {
        const baseCanvas = document.createElement('canvas');
        baseCanvas.width = canvasDrawWidth;
        baseCanvas.height = canvasDrawHeight;
        baseCanvas.getContext('2d').fillStyle = '#ffffff';
        baseCanvas.getContext('2d').fillRect(0, 0, canvasDrawWidth, canvasDrawHeight);
        layers = [{ canvas: baseCanvas, visible: true, opacity: 1 }];
        activeLayerIndex = 0;
        undoStack = [];
        redoStack = [];
        saveUndoState();
        renderLayersList();
      }

      function saveUndoState() {
        const activeCanvas = layers[activeLayerIndex]?.canvas;
        if (!activeCanvas) return;
        const snapshot = document.createElement('canvas');
        snapshot.width = activeCanvas.width;
        snapshot.height = activeCanvas.height;
        snapshot.getContext('2d').drawImage(activeCanvas, 0, 0);
        undoStack.push({ canvas: snapshot, layerIndex: activeLayerIndex });
        if (undoStack.length > MAX_UNDO) undoStack.shift();
        redoStack = [];
      }

      function undo() {
        if (undoStack.length === 0) return;
        const activeCanvas = layers[activeLayerIndex]?.canvas;
        if (!activeCanvas) return;
        const currentSnap = document.createElement('canvas');
        currentSnap.width = activeCanvas.width;
        currentSnap.height = activeCanvas.height;
        currentSnap.getContext('2d').drawImage(activeCanvas, 0, 0);
        redoStack.push({ canvas: currentSnap, layerIndex: activeLayerIndex });

        const last = undoStack.pop();
        if (last && layers[last.layerIndex]) {
          const lc = layers[last.layerIndex].canvas;
          lc.getContext('2d').clearRect(0, 0, lc.width, lc.height);
          lc.getContext('2d').drawImage(last.canvas, 0, 0);
          composeAndRender();
        }
      }

      function redo() {
        if (redoStack.length === 0) return;
        const activeCanvas = layers[activeLayerIndex]?.canvas;
        if (!activeCanvas) return;
        const currentSnap = document.createElement('canvas');
        currentSnap.width = activeCanvas.width;
        currentSnap.height = activeCanvas.height;
        currentSnap.getContext('2d').drawImage(activeCanvas, 0, 0);
        undoStack.push({ canvas: currentSnap, layerIndex: activeLayerIndex });

        const next = redoStack.pop();
        if (next && layers[next.layerIndex]) {
          const lc = layers[next.layerIndex].canvas;
          lc.getContext('2d').clearRect(0, 0, lc.width, lc.height);
          lc.getContext('2d').drawImage(next.canvas, 0, 0);
          composeAndRender();
        }
      }

      function getCompositeImage() {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvasDrawWidth;
        tempCanvas.height = canvasDrawHeight;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.fillStyle = '#ffffff';
        tempCtx.fillRect(0, 0, canvasDrawWidth, canvasDrawHeight);
        layers.forEach(layer => {
          if (layer.visible) {
            tempCtx.globalAlpha = layer.opacity || 1;
            tempCtx.drawImage(layer.canvas, 0, 0);
            tempCtx.globalAlpha = 1;
          }
        });
        return tempCanvas;
      }

      function composeAndRender() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        const composite = getCompositeImage();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(panX, panY);
        ctx.scale(zoom, zoom);
        ctx.drawImage(composite, 0, 0);
        ctx.restore();
      }

      function openLayersModal() {
        renderLayersList();
        layersModalOverlay.classList.add('show');
      }
      function closeLayersModal() {
        layersModalOverlay.classList.remove('show');
      }

      function renderLayersList() {
        layersListContainer.innerHTML = '';
        layers.forEach((layer, idx) => {
          const div = document.createElement('div');
          div.className = 'layer-item' + (idx === activeLayerIndex ? ' active' : '');
          div.innerHTML = `<span style="flex:1;">Слой ${idx+1}</span>`;

          const opacityInput = document.createElement('input');
          opacityInput.type = 'range';
          opacityInput.className = 'layer-opacity';
          opacityInput.min = '0';
          opacityInput.max = '1';
          opacityInput.step = '0.05';
          opacityInput.value = layer.opacity || 1;
          opacityInput.addEventListener('input', (e) => {
            e.stopPropagation();
            layer.opacity = parseFloat(e.target.value);
            composeAndRender();
          });
          div.appendChild(opacityInput);

          const delBtn = document.createElement('button');
          delBtn.textContent = 'X';
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (layers.length <= 1) return;
            layers.splice(idx, 1);
            if (activeLayerIndex >= layers.length) activeLayerIndex = layers.length - 1;
            renderLayersList();
            composeAndRender();
          });
          div.appendChild(delBtn);

          div.addEventListener('click', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
            activeLayerIndex = idx;
            renderLayersList();
          });
          layersListContainer.appendChild(div);
        });
      }

      // Кнопки управления слоями в модалке
      document.getElementById('addLayerModalBtn').addEventListener('click', () => { addLayer(); renderLayersList(); });
      document.getElementById('duplicateLayerModalBtn').addEventListener('click', () => { duplicateLayer(); renderLayersList(); });
      document.getElementById('mergeDownModalBtn').addEventListener('click', () => { mergeDown(); renderLayersList(); });

      function addLayer() {
        const nc = document.createElement('canvas');
        nc.width = canvasDrawWidth; nc.height = canvasDrawHeight;
        nc.getContext('2d').clearRect(0, 0, nc.width, nc.height);
        layers.push({ canvas: nc, visible: true, opacity: 1 });
        activeLayerIndex = layers.length - 1;
        saveUndoState(); composeAndRender();
      }
      function duplicateLayer() {
        const src = layers[activeLayerIndex].canvas;
        const nc = document.createElement('canvas');
        nc.width = canvasDrawWidth; nc.height = canvasDrawHeight;
        nc.getContext('2d').drawImage(src, 0, 0);
        layers.push({ canvas: nc, visible: true, opacity: layers[activeLayerIndex].opacity || 1 });
        activeLayerIndex = layers.length - 1;
        saveUndoState(); composeAndRender();
      }
      function mergeDown() {
        if (activeLayerIndex <= 0) return;
        const upper = layers[activeLayerIndex].canvas;
        const lower = layers[activeLayerIndex - 1].canvas;
        const lowerCtx = lower.getContext('2d');
        lowerCtx.globalAlpha = layers[activeLayerIndex].opacity || 1;
        lowerCtx.drawImage(upper, 0, 0);
        lowerCtx.globalAlpha = 1;
        layers.splice(activeLayerIndex, 1);
        activeLayerIndex--;
        saveUndoState(); composeAndRender();
      }

      function newCanvas() {
        if (confirm('Создать новый холст? Несохранённые данные будут потеряны.')) {
          initLayers(); composeAndRender(); closeLayersModal();
        }
      }

      // Галерея
      function getGallery() {
        try { return JSON.parse(localStorage.getItem('drawingGallery')) || []; }
        catch { return []; }
      }
      function saveGallery(gallery) {
        localStorage.setItem('drawingGallery', JSON.stringify(gallery));
      }

      function addToGallery() {
        const composite = getCompositeImage();
        const dataUrl = composite.toDataURL('image/jpeg', 0.75);
        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.width = 200; thumbCanvas.height = 150;
        const thumbCtx = thumbCanvas.getContext('2d');
        thumbCtx.drawImage(composite, 0, 0, 200, 150);
        const thumbDataUrl = thumbCanvas.toDataURL('image/jpeg', 0.7);

        const gallery = getGallery();
        if (gallery.length >= 30) { alert('Галерея заполнена (макс. 30). Удалите старые рисунки.'); return; }
        const item = {
          id: Date.now(),
          name: 'Рисунок ' + new Date().toLocaleString(),
          dataUrl: dataUrl,
          thumbnail: thumbDataUrl,
          date: new Date().toISOString()
        };
        gallery.unshift(item);
        saveGallery(gallery);
        alert('Сохранено в галерею!');
      }

      function renderGallery() {
        galleryGrid.innerHTML = '';
        const gallery = getGallery();
        if (gallery.length === 0) {
          galleryGrid.innerHTML = '<p style="color:#c9b8ff; text-align:center; width:100%; padding:2rem;">Галерея пуста. Сохраните рисунок кнопкой "В галерею".</p>';
          return;
        }
        gallery.forEach(item => {
          const div = document.createElement('div');
          div.className = 'gallery-item';
          const img = document.createElement('img');
          img.src = item.thumbnail;
          img.style.width = '100%';
          img.style.borderRadius = '10px';
          img.style.background = '#fff';
          div.appendChild(img);
          const info = document.createElement('div');
          info.className = 'info';
          info.textContent = new Date(item.date).toLocaleDateString();
          div.appendChild(info);
          const actions = document.createElement('div');
          actions.className = 'actions';
          const editBtn = document.createElement('button');
          editBtn.textContent = 'Ред.';
          editBtn.addEventListener('click', (e) => { e.stopPropagation(); loadFromGallery(item); });
          const delBtn = document.createElement('button');
          delBtn.textContent = 'Удалить';
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (confirm('Удалить рисунок из галереи?')) {
              const g = getGallery().filter(i => i.id !== item.id);
              saveGallery(g);
              renderGallery();
            }
          });
          actions.appendChild(editBtn);
          actions.appendChild(delBtn);
          div.appendChild(actions);
          div.addEventListener('click', () => loadFromGallery(item));
          galleryGrid.appendChild(div);
        });
      }

      function loadFromGallery(item) {
        if (confirm('Открыть рисунок из галереи? Текущий холст будет заменён.')) {
          const img = new Image();
          img.onload = () => {
            initLayers();
            const lc = layers[0].canvas;
            const lctx = lc.getContext('2d');
            lctx.clearRect(0, 0, lc.width, lc.height);
            lctx.drawImage(img, 0, 0, canvasDrawWidth, canvasDrawHeight);
            saveUndoState();
            composeAndRender();
            closeGallery();
          };
          img.src = item.dataUrl;
        }
      }

      function openGallery() { galleryOverlay.classList.add('show'); renderGallery(); }
      function closeGallery() { galleryOverlay.classList.remove('show'); }

      function loadImageToLayer(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const nc = document.createElement('canvas');
            nc.width = canvasDrawWidth; nc.height = canvasDrawHeight;
            const nctx = nc.getContext('2d');
            nctx.drawImage(img, 0, 0, canvasDrawWidth, canvasDrawHeight);
            layers.push({ canvas: nc, visible: true, opacity: 1 });
            activeLayerIndex = layers.length - 1;
            saveUndoState();
            renderLayersList();
            composeAndRender();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        let cx, cy;
        if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
        else if (e.changedTouches && e.changedTouches.length > 0) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
        else { cx = e.clientX; cy = e.clientY; }
        return {
          x: (cx - rect.left - panX) / zoom,
          y: (cy - rect.top - panY) / zoom
        };
      }

      function getColorAtPixel(x, y) {
        const composite = getCompositeImage();
        const compCtx = composite.getContext('2d');
        const px = Math.round(x), py = Math.round(y);
        if (px < 0 || px >= canvasDrawWidth || py < 0 || py >= canvasDrawHeight) return null;
        const p = compCtx.getImageData(px, py, 1, 1).data;
        return `#${p[0].toString(16).padStart(2,'0')}${p[1].toString(16).padStart(2,'0')}${p[2].toString(16).padStart(2,'0')}`;
      }

      function floodFill(sx, sy, fillColor) {
        const lc = layers[activeLayerIndex].canvas;
        const lctx = lc.getContext('2d');
        const imageData = lctx.getImageData(0, 0, lc.width, lc.height);
        const data = imageData.data;
        const w = lc.width, h = lc.height;
        const ix = Math.round(sx), iy = Math.round(sy);
        if (ix < 0 || ix >= w || iy < 0 || iy >= h) return;
        const idx = (iy * w + ix) * 4;
        const tr = data[idx], tg = data[idx+1], tb = data[idx+2], ta = data[idx+3];

        const tmp = document.createElement('canvas'); tmp.width = 1; tmp.height = 1;
        const tctx = tmp.getContext('2d'); tctx.fillStyle = fillColor; tctx.fillRect(0,0,1,1);
        const fd = tctx.getImageData(0,0,1,1).data;
        const fr=fd[0], fg=fd[1], fb=fd[2], fa=fd[3];
        if (tr===fr && tg===fg && tb===fb && ta===fa) return;

        const stack = [[ix, iy]];
        const visited = new Uint8Array(w * h);
        while (stack.length) {
          const [cx, cy] = stack.pop();
          if (cx<0||cx>=w||cy<0||cy>=h) continue;
          const cid = (cy*w+cx)*4;
          if (visited[cy*w+cx]) continue;
          if (data[cid]!==tr || data[cid+1]!==tg || data[cid+2]!==tb || data[cid+3]!==ta) continue;
          visited[cy*w+cx]=1;
          data[cid]=fr; data[cid+1]=fg; data[cid+2]=fb; data[cid+3]=fa;
          stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
        }
        lctx.putImageData(imageData, 0, 0);
      }

      function blurAt(x, y, radius) {
        const lc = layers[activeLayerIndex].canvas;
        const lctx = lc.getContext('2d');
        const r = Math.max(2, Math.floor(radius));
        const sx = Math.round(x - r), sy = Math.round(y - r);
        const sw = r*2, sh = r*2;
        if (sx<0||sy<0||sx+sw>lc.width||sy+sh>lc.height) return;
        const imageData = lctx.getImageData(sx, sy, sw, sh);
        const d = imageData.data;
        const tmp = new Uint8ClampedArray(d);
        for (let py=1; py<sh-1; py++) {
          for (let px=1; px<sw-1; px++) {
            let sr=0,sg=0,sb=0,sa=0;
            for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++) {
              const idx = ((py+dy)*sw+(px+dx))*4;
              sr+=tmp[idx]; sg+=tmp[idx+1]; sb+=tmp[idx+2]; sa+=tmp[idx+3];
            }
            const idx = (py*sw+px)*4;
            d[idx]=sr/9; d[idx+1]=sg/9; d[idx+2]=sb/9; d[idx+3]=sa/9;
          }
        }
        lctx.putImageData(imageData, sx, sy);
      }

      function applySymmetry(px, py, callback) {
        const w = canvasDrawWidth, h = canvasDrawHeight;
        callback(px, py);
        if (symmetryEnabled) {
          if (symmetryAxis.includes('x')) callback(w - px, py);
          if (symmetryAxis.includes('y')) callback(px, h - py);
          if (symmetryAxis === 'xy') callback(w - px, h - py);
        }
      }

      function startDraw(e) {
        e.preventDefault();
        if (currentTool === 'fill') {
          const pos = getPos(e);
          saveUndoState();
          floodFill(pos.x, pos.y, currentColor);
          composeAndRender();
          return;
        }
        if (currentTool === 'eyedropper') {
          const pos = getPos(e);
          const col = getColorAtPixel(pos.x, pos.y);
          if (col) { currentColor = col; colorPicker.value = col; }
          return;
        }
        drawing = true;
        saveUndoState();
        const pos = getPos(e);
        points = [pos];
        if (['shapeRect','shapeOval','shapeLine'].includes(currentTool)) {
          shapeStart = pos;
        } else if (currentTool === 'spray') {
          applySymmetry(pos.x, pos.y, (x,y) => sprayAtPos({x,y}));
        } else if (currentTool === 'blur') {
          applySymmetry(pos.x, pos.y, (x,y) => blurAt(x, y, lineWidth));
          composeAndRender();
        } else {
          applySymmetry(pos.x, pos.y, (x,y) => drawDot({x,y}));
        }
      }

      function draw(e) {
        if (!drawing) return;
        e.preventDefault();
        const pos = getPos(e);
        if (['shapeRect','shapeOval','shapeLine'].includes(currentTool)) {
          if (!shapeStart) return;
          composeAndRender();
          const lc = layers[activeLayerIndex].canvas;
          const lctx = lc.getContext('2d');
          lctx.save();
          lctx.globalCompositeOperation = (currentTool==='eraser')?'destination-out':globalCompositeOp;
          lctx.strokeStyle = currentColor;
          lctx.fillStyle = secondaryColor;
          lctx.lineWidth = lineWidth;
          lctx.lineCap = 'round';
          lctx.beginPath();
          if (currentTool === 'shapeRect') {
            lctx.rect(shapeStart.x, shapeStart.y, pos.x-shapeStart.x, pos.y-shapeStart.y);
            lctx.fill(); lctx.stroke();
          } else if (currentTool === 'shapeOval') {
            const rx = Math.abs(pos.x-shapeStart.x)/2, ry = Math.abs(pos.y-shapeStart.y)/2;
            const cx = (shapeStart.x+pos.x)/2, cy = (shapeStart.y+pos.y)/2;
            lctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
            lctx.fill(); lctx.stroke();
          } else if (currentTool === 'shapeLine') {
            lctx.moveTo(shapeStart.x, shapeStart.y);
            lctx.lineTo(pos.x, pos.y);
            lctx.stroke();
          }
          lctx.restore();
          return;
        }
        if (currentTool === 'spray') {
          applySymmetry(pos.x, pos.y, (x,y) => sprayAtPos({x,y}));
          return;
        }
        if (currentTool === 'blur') {
          applySymmetry(pos.x, pos.y, (x,y) => blurAt(x, y, lineWidth));
          composeAndRender();
          return;
        }
        points.push(pos);
        if (points.length > 3) points.shift();
        if (points.length >= 2) {
          const p1 = points[points.length-2], p2 = points[points.length-1];
          applySymmetry(p1.x, p1.y, (x1,y1) => {
            applySymmetry(p2.x, p2.y, (x2,y2) => smoothLine({x:x1,y:y1}, {x:x2,y:y2}));
          });
        }
      }

      function endDraw(e) {
        if (drawing) {
          if (['shapeRect','shapeOval','shapeLine'].includes(currentTool) && shapeStart) {
            const pos = getPos(e);
            const lc = layers[activeLayerIndex].canvas;
            const lctx = lc.getContext('2d');
            lctx.save();
            lctx.globalCompositeOperation = (currentTool==='eraser')?'destination-out':globalCompositeOp;
            lctx.strokeStyle = currentColor;
            lctx.fillStyle = secondaryColor;
            lctx.lineWidth = lineWidth;
            lctx.lineCap = 'round';
            lctx.beginPath();
            if (currentTool === 'shapeRect') {
              lctx.rect(shapeStart.x, shapeStart.y, pos.x-shapeStart.x, pos.y-shapeStart.y);
              lctx.fill(); lctx.stroke();
            } else if (currentTool === 'shapeOval') {
              const rx = Math.abs(pos.x-shapeStart.x)/2, ry = Math.abs(pos.y-shapeStart.y)/2;
              const cx = (shapeStart.x+pos.x)/2, cy = (shapeStart.y+pos.y)/2;
              lctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
              lctx.fill(); lctx.stroke();
            } else if (currentTool === 'shapeLine') {
              lctx.moveTo(shapeStart.x, shapeStart.y);
              lctx.lineTo(pos.x, pos.y);
              lctx.stroke();
            }
            lctx.restore();
            composeAndRender();
          }
          drawing = false;
          points = [];
          shapeStart = null;
        }
      }

      function sprayAtPos(pos) {
        const lc = layers[activeLayerIndex].canvas;
        const lctx = lc.getContext('2d');
        const density = Math.floor(lineWidth * 2.5);
        lctx.fillStyle = currentColor;
        for (let i=0; i<density; i++) {
          const angle = Math.random()*Math.PI*2;
          const dist = Math.random()*lineWidth;
          lctx.fillRect(pos.x+Math.cos(angle)*dist, pos.y+Math.sin(angle)*dist, 2, 2);
        }
        composeAndRender();
      }

      function drawDot(pos) {
        const lc = layers[activeLayerIndex].canvas;
        const lctx = lc.getContext('2d');
        lctx.beginPath();
        lctx.arc(pos.x, pos.y, lineWidth/2, 0, Math.PI*2);
        lctx.fillStyle = (currentTool==='eraser')?'#ffffff':currentColor;
        lctx.fill();
        composeAndRender();
      }

      function smoothLine(p1, p2) {
        const lc = layers[activeLayerIndex].canvas;
        const lctx = lc.getContext('2d');
        lctx.beginPath();
        lctx.moveTo(p1.x, p1.y);
        lctx.lineTo(p2.x, p2.y);
        lctx.strokeStyle = (currentTool==='eraser')?'#ffffff':currentColor;
        lctx.lineWidth = (currentTool==='pencil')?Math.max(1, lineWidth*0.4):lineWidth;
        lctx.lineCap = 'round';
        lctx.lineJoin = 'round';
        lctx.globalCompositeOperation = (currentTool==='eraser')?'destination-out':globalCompositeOp;
        lctx.stroke();
        if (currentTool==='neon') {
          lctx.save();
          lctx.globalCompositeOperation='lighter';
          lctx.strokeStyle=currentColor;
          lctx.lineWidth=lineWidth*0.35;
          lctx.shadowColor=currentColor;
          lctx.shadowBlur=18;
          lctx.stroke();
          lctx.restore();
        }
        composeAndRender();
      }

      function setActiveTool(tool) {
        currentTool = tool;
        Object.values(toolButtons).forEach(b => b.classList.remove('active-tool'));
        if (toolButtons[tool]) toolButtons[tool].classList.add('active-tool');
        canvas.style.cursor = (tool==='eraser')?'cell':'crosshair';
        shapeStart = null;
      }

      function toggleSymmetry() {
        if (!symmetryEnabled) { symmetryEnabled = true; symmetryAxis = 'x'; symmetryBtn.textContent = 'Симм. X'; symmetryBtn.classList.add('active-tool'); }
        else if (symmetryAxis === 'x') { symmetryAxis = 'y'; symmetryBtn.textContent = 'Симм. Y'; }
        else if (symmetryAxis === 'y') { symmetryAxis = 'xy'; symmetryBtn.textContent = 'Симм. XY'; }
        else { symmetryEnabled = false; symmetryBtn.textContent = 'Симметрия'; symmetryBtn.classList.remove('active-tool'); }
      }

      function updateZoom() {
        zoomLevelSpan.textContent = Math.round(zoom*100)+'%';
        composeAndRender();
      }

      function goHome() {
        if (confirm('Выйти в главное меню? Несохранённые изменения будут потеряны.')) {
          app.classList.remove('active');
          launcher.classList.remove('hidden');
        }
      }

      // Event listeners
      document.getElementById('startBtn').addEventListener('click', ()=>{
        launcher.classList.add('hidden');
        app.classList.add('active');
        if (layers.length === 0) initLayers();
        composeAndRender();
      });
      document.getElementById('galleryLauncherBtn').addEventListener('click', openGallery);
      closeGalleryBtn.addEventListener('click', closeGallery);
      galleryOverlay.addEventListener('click', (e)=>{ if(e.target===galleryOverlay) closeGallery(); });

      Object.entries(toolButtons).forEach(([tool, btn]) => {
        btn.addEventListener('click', (e) => { e.preventDefault(); setActiveTool(tool); });
      });

      symmetryBtn.addEventListener('click', (e) => { e.preventDefault(); toggleSymmetry(); });
      undoBtn.addEventListener('click', (e)=>{ e.preventDefault(); undo(); });
      redoBtn.addEventListener('click', (e)=>{ e.preventDefault(); redo(); });
      colorPicker.addEventListener('input', e => currentColor = e.target.value);
      colorPicker2.addEventListener('input', e => secondaryColor = e.target.value);
      sizeSlider.addEventListener('input', e => { lineWidth = parseInt(e.target.value); sizeValue.textContent = lineWidth+'px'; });
      blendSelect.addEventListener('change', e => globalCompositeOp = e.target.value);
      downloadBtn.addEventListener('click', (e)=>{
        e.preventDefault();
        const comp = getCompositeImage();
        const a = document.createElement('a');
        a.download = 'рисунок_'+Date.now()+'.png';
        a.href = comp.toDataURL('image/png');
        a.click();
      });
      saveToGalleryBtn.addEventListener('click', (e)=>{ e.preventDefault(); addToGallery(); });
      newCanvasBtn.addEventListener('click', (e)=>{ e.preventDefault(); newCanvas(); });
      loadImageBtn.addEventListener('click', (e)=>{ e.preventDefault(); imageLoader.click(); });
      imageLoader.addEventListener('change', e => { if(e.target.files[0]){ loadImageToLayer(e.target.files[0]); imageLoader.value=''; } });
      zoomInBtn.addEventListener('click', e=>{ e.preventDefault(); zoom=Math.min(zoom*1.25,5); updateZoom(); });
      zoomOutBtn.addEventListener('click', e=>{ e.preventDefault(); zoom=Math.max(zoom/1.25,0.15); updateZoom(); });
      zoomResetBtn.addEventListener('click', e=>{ e.preventDefault(); zoom=1; panX=0; panY=0; updateZoom(); });
      homeBtn.addEventListener('click', e => { e.preventDefault(); goHome(); });

      layersToggleBtn.addEventListener('click', (e) => {
        e.preventDefault();
        openLayersModal();
      });
      closeLayersModalBtn.addEventListener('click', closeLayersModal);
      layersModalOverlay.addEventListener('click', (e) => {
        if (e.target === layersModalOverlay) closeLayersModal();
      });

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', endDraw);
      canvas.addEventListener('mouseleave', endDraw);
      canvas.addEventListener('touchstart', startDraw, {passive: false});
      canvas.addEventListener('touchmove', draw, {passive: false});
      canvas.addEventListener('touchend', endDraw);
      canvas.addEventListener('touchcancel', endDraw);

      window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key==='z') { e.preventDefault(); undo(); }
        if (e.ctrlKey && e.key==='y') { e.preventDefault(); redo(); }
        if (e.ctrlKey && e.key==='s') { e.preventDefault(); downloadBtn.click(); }
      });

      window.addEventListener('resize', composeAndRender);
      composeAndRender();
    })();
  </script>
</body>
</html>
